
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart - FreshCart</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .cart-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            gap: 15px;
            flex-wrap: wrap;
        }

        .cart-item h3 {
            color: #168b43;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-controls button {
            padding: 7px 13px;
        }

        .remove-btn {
            background: #e53935;
        }

        .remove-btn:hover {
            background: #b71c1c;
        }

        .cart-summary {
            background: #eaffed;
            padding: 25px;
            border-radius: 10px;
            text-align: right;
            margin-top: 25px;
        }

        .cart-summary h2 {
            margin-bottom: 15px;
            color: #164d2c;
        }

        .empty-cart {
            text-align: center;
            padding: 50px;
        }

        @media(max-width: 600px) {
            .cart-item {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav class="navbar">

            <h1 class="logo">Fresh<span>Cart</span> 🛒</h1>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">My Cart</a></li>
            </ul>

            <button onclick="location.href='products.html'">
                Continue Shopping
            </button>

        </nav>
    </header>


    <section class="section">
        <h2>My Shopping Cart 🛒</h2>
        <p>Review your selected grocery products</p>
    </section>


    <div class="cart-container">

        <div id="cart-items"></div>

        <div id="cart-summary" class="cart-summary" style="display:none;">

            <h2>Order Summary</h2>

            <p id="total-items"></p>

            <h3 id="total-price"></h3>

            <br>

            <button onclick="clearCart()" style="background:#e53935;">
                Clear Cart
            </button>

            <button onclick="location.href='checkout.html'">
                Proceed to Checkout →
            </button>

        </div>

    </div>


    <footer>
        <h2>FreshCart 🛒</h2>
        <p>Freshness Delivered To Your Home!</p>
        <p>Contact: freshcart@gmail.com</p>
        <p>© 2026 FreshCart. All Rights Reserved.</p>
    </footer>


    <script src="js/script.js"></script>

    <script>
        function displayCart() {

            let cartItems = document.getElementById("cart-items");
            let summary = document.getElementById("cart-summary");

            cartItems.innerHTML = "";

            if (cart.length === 0) {

                cartItems.innerHTML = `
                    <div class="empty-cart">
                        <h2>Your Cart is Empty! 😔</h2>
                        <p>Add some fresh groceries to your cart.</p>
                        <br>
                        <button onclick="location.href='products.html'">
                            Shop Now
                        </button>
                    </div>
                `;

                summary.style.display = "none";
                return;
            }

            let total = 0;
            let count = 0;

            cart.forEach(function(item) {

                let subtotal = item.price * item.quantity;

                total += subtotal;
                count += item.quantity;

                cartItems.innerHTML += `
                    <div class="cart-item">

                        <div>
                            <h3>${item.name}</h3>
                            <p>Price: ₹${item.price}</p>
                            <p>Subtotal: ₹${subtotal}</p>
                        </div>

                        <div class="quantity-controls">

                            <button onclick="changeCartQuantity('${item.name}', -1)">-</button>

                            <strong>${item.quantity}</strong>

                            <button onclick="changeCartQuantity('${item.name}', 1)">+</button>

                        </div>

                        <button class="remove-btn"
                            onclick="deleteCartItem('${item.name}')">
                            Remove
                        </button>

                    </div>
                `;
            });

            document.getElementById("total-items").innerText =
                "Total Products: " + count;

            document.getElementById("total-price").innerText =
                "Total Amount: ₹" + total;

            summary.style.display = "block";
        }


        function changeCartQuantity(name, change) {

            let item = cart.find(function(product) {
                return product.name === name;
            });

            if (!item) return;

            item.quantity += change;

            if (item.quantity <= 0) {
                cart = cart.filter(function(product) {
                    return product.name !== name;
                });
            }

            saveCart();
            displayCart();
        }


        function deleteCartItem(name) {

            cart = cart.filter(function(item) {
                return item.name !== name;
            });

            saveCart();
            displayCart();
        }


        function clearCart() {

            if (confirm("Are you sure you want to clear your cart?")) {

                cart = [];

                saveCart();
                displayCart();
            }
        }


        document.addEventListener("DOMContentLoaded", displayCart);
    </script>

</body>
</html>
