
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshCart - Login</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .auth-container {
            max-width: 450px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .auth-container h2 {
            text-align: center;
            color: #218838;
        }

        .auth-container input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .auth-container button {
            width: 100%;
            padding: 12px;
            background: #218838;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        .auth-container p {
            text-align: center;
        }

        .auth-container a {
            color: #218838;
        }

        #message {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <h2>Welcome Back!</h2>
        <p>Login to your FreshCart account</p>

        <form id="loginForm">
            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>
        </form>

        <p id="message"></p>

        <p>Don't have an account?
            <a href="register.html">Register Here</a>
        </p>

        <p><a href="index.html">Back to Home</a></p>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim().toLowerCase();
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            let users = JSON.parse(localStorage.getItem("freshCartUsers") || "[]");

            const user = users.find(function(item) {
                return item.email === email && item.password === password;
            });

            if (user) {
                localStorage.setItem("freshCartLoggedInUser", JSON.stringify({
                    name: user.name,
                    email: user.email
                }));

                message.style.color = "green";
                message.textContent = "Login successful! Welcome " + user.name;

                setTimeout(function() {
                    window.location.href = "index.html";
                }, 1200);

            } else {
                message.style.color = "red";
                message.textContent = "Invalid email or password. Please try again.";
            }
        });
    </script>

</body>
</html>
